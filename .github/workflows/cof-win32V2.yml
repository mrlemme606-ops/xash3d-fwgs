# Builds ONLY the 32-bit Windows engine (what Cry of Fear needs).
# Based on the upstream Xash3D FWGS workflow (c-cpp.yml), trimmed to one job.
name: Build Windows 32-bit (CoF VR)

on:
  push:
  workflow_dispatch:   # lets you press "Run workflow" by hand in the Actions tab

jobs:
  build:
    runs-on: windows-2022
    env:
      SDL_VERSION: 2.32.10
      FFMPEG_VERSION: '9.0'
      YY_THUNKS_VERSION: v1.2.1
      GH_CPU_ARCH: i386
      GH_CPU_OS: win32
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Fetch OpenVR C header (pinned to an exact Valve commit)
        shell: bash
        run: |
          curl -fsSL -o ref/gl/openvr_capi.h \
            https://raw.githubusercontent.com/ValveSoftware/openvr/6aacebd1246592d9911439d5abd0c657b8948ab0/headers/openvr_capi.h
          test -s ref/gl/openvr_capi.h

      - name: Install dependencies (SDL2, etc.)
        run: bash scripts/gha/deps_win32.sh

      - name: Build engine
        run: bash scripts/gha/build_win32.sh
        # Note: the script's code-signing step fails in forks (no signing key).
        # That is expected and does not stop the build.

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: xash3d-win32-i386
          path: artifacts/*
